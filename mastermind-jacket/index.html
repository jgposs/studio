  <div class="mobile-menu" id="mobile-menu">

  <div class="project-layout">

    <aside class="project-info">
      <div class="info-block">
        <span class="info-value title">MASTERMIND WORLD SS2018 denim jacket</span>

      <div class="info-block">
        <span class="info-value">Photography and a short loop of a MASTERMIND WORLD SS2018 denim jacket. Produced in collaboration with Jack Manzi.</span>

  <script>
    (function () {
      var btn = document.getElementById('hamburger');
      var menu = document.getElementById('mobile-menu');
      function setOpen(open) {
        btn.classList.toggle('open', open);
        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      window.toggleMenu = function () {
        setOpen(!menu.classList.contains('open'));
      };
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });

      // Autoplay cannot be suppressed from CSS, so honour reduced-motion here:
      // pause on the first frame and give the viewer controls to start it.
      var vid = document.getElementById('jacket-loop');
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
      function applyMotion() {
        if (!vid) return;
        if (reduce.matches) {
          vid.autoplay = false;
          vid.removeAttribute('loop');
          vid.setAttribute('controls', '');
          vid.pause();
        } else {
          vid.setAttribute('loop', '');
          vid.removeAttribute('controls');
        }
      }
      applyMotion();
      if (reduce.addEventListener) reduce.addEventListener('change', applyMotion);
    })();
  </script>
