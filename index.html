<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>James Poss</title>
  <meta name="description" content="Portfolio of James Poss, a multidisciplinary creative working across design, product, ecommerce, and visual content.">
  <link rel="canonical" href="https://jamesposs.studio/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="James Poss">
  <meta property="og:title" content="James Poss">
  <meta property="og:description" content="Portfolio of James Poss, a multidisciplinary creative working across design, product, ecommerce, and visual content.">
  <meta property="og:url" content="https://jamesposs.studio/">
  <meta property="og:image" content="https://jamesposs.studio/images/boot-bag-black/Switch_Designs-051.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Bodoni:wght@700&family=Inter:wght@400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    html, body { background-color: #f5f5f4; color: #1a1a18; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(12px, 1.6vw, 24px);
      max-width: 1100px;
      margin: 0 auto;
      /* Fixed gutters, not vw-based: max-width already handles wide screens, and
         a scaling gutter inside a fixed cap shrinks the cells on big monitors. */
      padding-left: clamp(20px, 4vw, 40px);
      padding-right: clamp(20px, 4vw, 40px);
      padding-bottom: 180px;
    }

    .cell {
      display: block;
      text-decoration: none;
      color: inherit;
      overflow: hidden;          /* contains the hover zoom */
    }

    /* Thumbnails are pre-cropped square files, so the attribute ratio already
       matches and this is belt-and-braces for the two remote video stills. */
    .cell img {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background: #e8e7e2;
      transition: transform 0.5s cubic-bezier(0.2, 0.6, 0.2, 1),
                  opacity 0.3s ease;
    }

    /* The image scales inside a fixed tile, so nothing reflows. Guarded on
       hover-capable pointers so the state cannot stick after a tap. */
    @media (hover: hover) {
      .cell:hover img {
        transform: scale(1.05);
        opacity: 0.92;
      }
    }

    .cell:focus-visible img {
      transform: scale(1.05);
      opacity: 0.92;
    }

    @media (prefers-reduced-motion: reduce) {
      .cell img { transition: opacity 0.2s ease; }
      .cell:hover img,
      .cell:focus-visible img { transform: none; opacity: 0.82; }
    }

    .cell:focus-visible {
      outline: 2px solid #1a1a18;
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 20px;
        padding-left: 20px;
        padding-right: 20px;
        padding-bottom: 100px;
      }
    }

  </style>
</head>
<body>

  <a class="fixed-label" href="/">James Poss</a>

  <nav class="fixed-nav">
    <a href="/">Work</a>
    <a href="/press">Press</a>
    <a href="/about">About</a>
  </nav>

  <button class="hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu" aria-expanded="false" aria-controls="mobile-menu">
    <span></span><span></span><span></span>
  </button>

  <div class="mobile-menu" id="mobile-menu">
    <a href="/" onclick="toggleMenu()">Work</a>
    <a href="/press" onclick="toggleMenu()">Press</a>
    <a href="/about" onclick="toggleMenu()">About</a>
  </div>

  <main class="grid" style="padding-top: 82px;">

    <a href="/boot-bag-black" class="cell">
      <img src="images/thumbs/boot-bag-black.jpg" alt="Boot Bag Black" width="1200" height="1200" loading="eager" fetchpriority="high" decoding="async">
    </a>

    <a href="/cornice-dresser" class="cell">
      <img src="images/thumbs/cornice-dresser.jpg" alt="Cornice Dresser" width="1200" height="1200" loading="eager" fetchpriority="high" decoding="async">
    </a>

    <a href="/team" class="cell">
      <img src="images/thumbs/team.jpg" alt="TEAM — MiniDV" width="528" height="528" loading="lazy" decoding="async">
    </a>

    <a href="/boot-bag-coyote" class="cell">
      <img src="images/thumbs/boot-bag-coyote.jpg" alt="Boot Bag Coyote" width="1200" height="1200" loading="lazy" decoding="async">
    </a>

    <a href="/creative-switch-pt1" class="cell">
      <img src="images/thumbs/creative-switch-pt1.jpg" alt="Creative — Switch PT1" width="1173" height="1173" loading="lazy" decoding="async">
    </a>

    <a href="/bullet-glove" class="cell">
      <img src="images/thumbs/bullet-glove.jpg" alt="Bullet Glove" width="627" height="627" loading="lazy" decoding="async">
    </a>

    <a href="/switch-team-edit" class="cell">
      <img src="images/thumbs/switch-team-edit.jpg" alt="Switch Team Edit" width="1080" height="1080" loading="lazy" decoding="async">
    </a>

    <a href="/creative-switch-pt2" class="cell">
      <img src="images/thumbs/creative-switch-pt2.jpg" alt="Creative — Switch PT2" width="864" height="864" loading="lazy" decoding="async">
    </a>

    <a href="/creative-switch-pt3" class="cell">
      <img src="images/thumbs/creative-switch-pt3.jpg" alt="Creative — Switch PT3" width="1146" height="1146" loading="lazy" decoding="async">
    </a>

    <a href="/mastermind-jacket" class="cell">
      <img src="images/thumbs/mastermind-jacket.jpg" alt="MASTERMIND WORLD SS2018 denim jacket" width="1200" height="1200" loading="lazy" decoding="async">
    </a>

  </main>

  <script>
    (function () {
      var btn = document.getElementById('hamburger');
      var menu = document.getElementById('mobile-menu');
      function setOpen(open) {
        btn.classList.toggle('open', open);
        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      window.toggleMenu = function () {
        setOpen(!menu.classList.contains('open'));
      };
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') setOpen(false);
      });
    })();
  </script>

</body>
</html>
